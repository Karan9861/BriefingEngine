name: Keep Streamlit App Awake

on:
  schedule:
    # Run every 2 days (approx) to keep it alive, or change as needed
    - cron: "0 */10 * * *"
  workflow_dispatch: # Allows manual run

jobs:
  run_selenium_script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Wake up Streamlit App
        shell: python
        run: |
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from webdriver_manager.chrome import ChromeDriverManager
          import time

          # -----------------------------------------------------
          # YOUR APP URL
          # -----------------------------------------------------
          url = "https://briefingengine.streamlit.app/"
          
          print(f"Starting browser to visit: {url}")

          # Setup Headless Chrome
          chrome_options = Options()
          chrome_options.add_argument("--headless") 
          chrome_options.add_argument("--no-sandbox")
          chrome_options.add_argument("--disable-dev-shm-usage")

          try:
              service = Service(ChromeDriverManager().install())
              driver = webdriver.Chrome(service=service, options=chrome_options)
              
              driver.get(url)
              time.sleep(10) # Wait for initial load
              
              # Check for the "Yes, get this app back up!" button
              try:
                  buttons = driver.find_elements(By.XPATH, "//button[contains(text(), 'Yes, get this app back up!')]")
                  if buttons:
                      print("💤 App is hibernating. Clicking the wake up button...")
                      buttons[0].click()
                      # Wait longer for the actual boot-up after clicking
                      time.sleep(60)
                      print("✅ Button clicked. App should be waking up now.")
                  else:
                      print("👀 Wake up button not found. App might already be running.")
              except Exception as e:
                  print(f"Button check failed: {e}")

              # Final check
              print(f"Final Page Title: {driver.title}")
              driver.quit()
              
          except Exception as e:
              print(f"Error: {e}")
